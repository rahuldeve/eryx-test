[project]
name = "eryx-test"
version = "0.1.0"
description = "Eryx sandbox with numpy, pandas and bokeh support"
requires-python = ">=3.12"
dependencies = [
    "pyeryx>=0.11.0",
]

[dependency-groups]
dev = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.poe.tasks]
fetch = { cmd = "python scripts/fetch_packages.py", help = "Download the pure-Python packages into ./packages" }
build-wasi = { cmd = "bash wasi-build/build_packages.sh", help = "Cross-compile numpy and pandas for WASI (slow; set JOBS to limit parallelism)" }
packages = { sequence = ["fetch", "build-wasi"], help = "Fetch and build every sandbox package" }
dataframe = { cmd = "python scripts/run_dataframe_bokeh.py", help = "Plot a host DataFrame with bokeh in a sandbox" }
test = { cmd = "pytest", help = "Run the sandbox tests (without the slow numpy/pandas suites)" }
test-suites = { cmd = "pytest -m slow -s", help = "Run numpy's and pandas' own test suites (slow): poe test-suites [-k numpy|pandas] [--suite-filter PATH]" }
fmt = { cmd = "ruff format", help = "Format the code" }
lint = { cmd = "ruff check", help = "Lint the code" }

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = ["-m", "not slow"]
markers = ["slow: numpy/pandas test suites, run with -m slow"]

[tool.pyright]
# scripts/ and tests/ import sandbox_env from scripts/ (pytest adds it via pythonpath)
extraPaths = ["scripts"]
